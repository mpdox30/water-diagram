<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผังน้ำชุมชน - ตำบลนครป่าหมาก (Interactive Canvas)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="data/nakhon_pa_mak.js"></script>
    <script src="thai_admin_divisions.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; background-color: #f0f2f5; }
        #sidebar { width: 340px; background: #fff; padding: 15px; box-shadow: 2px 0 5px rgba(0,0,0,0.1); z-index: 10; display: flex; flex-direction: column; overflow-y: auto; }
        #cy { flex-grow: 1; position: relative; }
        h3 { color: #0056b3; font-size: 15px; margin: 10px 0 5px 0; border-bottom: 1px solid #eee; padding-bottom: 5px;}
        
        .history-controls { display: flex; gap: 10px; margin-bottom: 10px; }
        .history-btn { flex: 1; background: #e2e3e5; border: 1px solid #ccc; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .history-btn:hover:not(:disabled) { background: #d6d8db; }
        .history-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .tool-btn { 
            background: #fff; border: 1px solid #ccc; padding: 6px 8px; margin-bottom: 4px; 
            border-radius: 4px; cursor: pointer; display: flex; align-items: center; transition: 0.2s; font-size: 13px;
        }
        .tool-btn:hover { background: #e9ecef; }
        .tool-btn.active { background: #cce5ff; border-color: #0056b3; font-weight: bold; }
        .tool-btn.danger.active { background: #f8d7da; border-color: #dc3545; color: #dc3545; }
        .tool-btn.edit.active { background: #fff3cd; border-color: #ffc107; color: #856404; }
        .tool-btn.rotate.active { background: #d1ecf1; border-color: #17a2b8; color: #0c5460; }
        
        .icon { width: 20px; height: 20px; margin-right: 10px; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; color: black; }
        .line-icon { width: 20px; height: 4px; background: #0056b3; margin-right: 10px; display: inline-block; }
        .line-icon.thin { height: 2px; background: #4da6ff; }
        
        #instruction { margin-top: 15px; font-size: 12px; color: #666; background: #f8f9fa; padding: 10px; border-radius: 5px; line-height: 1.5;}
    </style>
</head>
<body>

    <div id="sidebar">
        <h2 style="font-size: 16px; color: #0056b3; text-align: center; margin-top: 0;">เครื่องมือจัดการผังน้ำ</h2>

        <!-- 1. เลือกตำบล (ตาม ADR-005 + คำขอเพิ่มเติมของ Ton 2026-08-30: เลือกได้ทุกตำบลทั่วประเทศ ไม่จำกัด
             แค่ตำบลที่เตรียมข้อมูลไว้ล่วงหน้า — ถ้าตำบลที่เลือกยังไม่เคยมีผังในระบบ จะขึ้นสถานะ "สร้างใหม่" ให้
             ตั้งรหัสผ่าน manager แล้วสร้างได้เลย ถ้ามีผังอยู่แล้วจะโหลดมาให้แก้ไข/สั่งรัน engine ใหม่ทับได้ตามเดิม
             ระบบเลือกจังหวัด/อำเภอ/ตำบล อ่านจาก thai_admin_divisions.js (สกัดจาก THA_Tambon.dbf ที่ bundle
             ไว้แล้วใน 02_engine_data/admin_boundary — ครบทุกตำบลทั่วประเทศ) ส่วนการเช็คว่า "มีอยู่แล้วหรือไม่"
             เรียก public.nw_find_tambon_id() ซึ่งตัดคำนำหน้า "ตำบล/อำเภอ" ออกก่อนเทียบเสมอ (ชื่อในตาราง tambons
             เดิมกับใน THA_Tambon.dbf ใส่คำนำหน้าไม่ตรงกัน) -->
        <div id="tambon-select-section" style="border:1px solid #ddd; border-radius:6px; padding:10px; margin-bottom:12px; background:#f8f9fa;">
            <label style="font-size:12px; font-weight:bold; color:#0056b3; display:block; margin-bottom:6px;">1. เลือกตำบล</label>
            <select id="province-select" style="width:100%; padding:6px; margin-bottom:4px; font-size:13px; box-sizing:border-box;"><option value="">— จังหวัด —</option></select>
            <select id="amphoe-select" style="width:100%; padding:6px; margin-bottom:4px; font-size:13px; box-sizing:border-box;" disabled><option value="">— อำเภอ —</option></select>
            <select id="tambon-pick-select" style="width:100%; padding:6px; margin-bottom:8px; font-size:13px; box-sizing:border-box;" disabled><option value="">— ตำบล —</option></select>

            <div id="tambon-status-info" style="font-size:11px; color:#999; margin-bottom:8px;"></div>

            <!-- โชว์เฉพาะตอนเลือกตำบลที่ยังไม่มีผังในระบบ -->
            <div id="new-tambon-create-box" style="display:none; margin-bottom:8px;">
                <input id="new-tambon-password" type="password" placeholder="ตั้งรหัสผ่าน manager สำหรับตำบลนี้ (อย่างน้อย 4 ตัวอักษร)" style="width:100%; padding:6px; margin-bottom:6px; font-size:13px; box-sizing:border-box;">
                <button id="btn-create-tambon" class="tool-btn" style="width:100%; justify-content:center; box-sizing:border-box;" onclick="onCreateNewTambonClick()">✚ สร้างผังน้ำตำบลนี้</button>
            </div>

            <button id="btn-run-engine" class="tool-btn" style="width:100%; justify-content:center; box-sizing:border-box;" onclick="onRunEngineClick()">⚙ รัน Engine ใหม่สำหรับตำบลนี้ (manager)</button>
            <div id="engine-run-status" style="font-size:12px; margin-top:6px; min-height:16px;"></div>
        </div>
        
        <!-- แถบเครื่องมือ Undo/Redo -->
        <div class="history-controls">
            <button id="btn-undo" class="history-btn" onclick="undo()" disabled>↶ เลิกทำ (Undo)</button>
            <button id="btn-redo" class="history-btn" onclick="redo()" disabled>↷ ทำซ้ำ (Redo)</button>
        </div>
        
        <h3>1. จุดเชื่อมและลำน้ำ</h3>
        <button class="tool-btn" onclick="selectTool('generic_node', this)"><span class="icon" style="color: #6c757d;">●</span> เพิ่มจุดเชื่อม (Node)</button>
        <button class="tool-btn" onclick="selectTool('draw_main', this)"><span class="line-icon"></span> วาดลำน้ำหลัก</button>
        <button class="tool-btn" onclick="selectTool('draw_branch', this)"><span class="line-icon thin"></span> วาดลำน้ำสาขา</button>

        <h3>2. โครงสร้างปัจจุบัน (ดำทึบ)</h3>
        <button class="tool-btn" onclick="selectTool('gate', this)"><span class="icon">◆</span> ปตร. (ปัจจุบัน)</button>
        <button class="tool-btn" onclick="selectTool('weir', this)"><span class="icon">▬</span> ฝาย (ปัจจุบัน)</button>
        <button class="tool-btn" onclick="selectTool('reservoir', this)"><span class="icon">▲</span> อ่างเก็บน้ำ</button>
        <button class="tool-btn" onclick="selectTool('waterbody', this)"><span class="icon">▭</span> แหล่งน้ำ/บึง</button>
        <button class="tool-btn" onclick="selectTool('telemetry', this)"><span class="icon">◎</span> สถานีโทรมาตร</button>
        <button class="tool-btn" onclick="selectTool('pump', this)"><span class="icon">℗</span> สถานีสูบน้ำ</button>

        <h3>3. แผนในอนาคต (โปร่งขอบดำ)</h3>
        <button class="tool-btn" onclick="selectTool('gate_plan', this)"><span class="icon" style="color:gray;">◇</span> ปตร. (แผน)</button>
        <button class="tool-btn" onclick="selectTool('weir_plan', this)"><span class="icon" style="color:gray;">▭</span> ฝาย (แผน)</button>

        <h3>4. จัดการข้อมูล (แก้ไข/หมุน/ลบ)</h3>
        <button class="tool-btn" onclick="selectTool('text_box', this)"><span class="icon" style="color:#0056b3; font-size:16px;">T</span> วางข้อความอิสระ</button>
        <button class="tool-btn edit" onclick="selectTool('edit_info', this)"><span class="icon" style="color:#856404; font-size:16px;">✎</span> แก้ไขชื่อ/รายละเอียด</button>
        <button class="tool-btn rotate" onclick="selectTool('rotate', this)"><span class="icon" style="color:#17a2b8; font-size:18px;">↻</span> หมุนสัญลักษณ์ (90 องศา)</button>
        <button class="tool-btn danger" onclick="selectTool('delete', this)"><span class="icon" style="color:red;">✖</span> ลบข้อมูล (เส้น/โหนด)</button>

        <div id="instruction">
            <strong>สถานะปัจจุบัน:</strong> <span id="current-tool" style="color:#0056b3; font-weight:bold;">ดูผังภาพ (View)</span><br><br>
            <span id="help-text">คลิกที่พื้นที่ว่างเพื่อยกเลิกเครื่องมือ หรือใช้เมาส์ซูม/เลื่อนดูผังน้ำ</span>
        </div>
        
        <button style="margin-top: 15px; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight:bold;" onclick="exportData()">
            บันทึกผังน้ำชุมชน
        </button>
    </div>

    <div id="cy"></div>

    <script>
        let currentTool = null;
        let sourceNodeForEdge = null; 
        let nodeCount = 100; 

        // ระบบ History สำหรับ Undo/Redo
        let historyStack = [];
        let historyIndex = -1;

        // บันทึกสถานะ (Snapshot)
        function saveState() {
            // หากมีการเปลี่ยนแปลงใหม่หลังจากกด Undo ไปแล้ว ให้ทิ้ง History อนาคตที่ทำซ้ำไม่ได้แล้ว
            if (historyIndex < historyStack.length - 1) {
                historyStack = historyStack.slice(0, historyIndex + 1);
            }
            // บันทึกข้อมูลกราฟแบบ JSON เก็บไว้ใน Array
            historyStack.push(cy.elements().jsons());
            historyIndex++;
            updateHistoryUI();
        }

        // ย้อนกลับ (Undo)
        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                cy.elements().remove(); // ลบของเดิมบนจอทิ้ง
                cy.add(historyStack[historyIndex]); // โหลดของเก่ากลับมา
                updateHistoryUI();
            }
        }

        // ทำซ้ำ (Redo)
        function redo() {
            if (historyIndex < historyStack.length - 1) {
                historyIndex++;
                cy.elements().remove();
                cy.add(historyStack[historyIndex]);
                updateHistoryUI();
            }
        }

        // อัปเดตปุ่ม Undo/Redo
        function updateHistoryUI() {
            document.getElementById('btn-undo').disabled = historyIndex <= 0;
            document.getElementById('btn-redo').disabled = historyIndex >= historyStack.length - 1;
        }

        function selectTool(tool, element) {
            currentTool = tool;
            sourceNodeForEdge = null; 
            
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            if(element) element.classList.add('active');
            
            let statusText = "ดูผังภาพ (View)";
            let helpText = "คลิกที่พื้นที่ว่างเพื่อยกเลิกเครื่องมือ";

            const insertTools = ['gate', 'weir', 'reservoir', 'telemetry', 'pump', 'gate_plan', 'weir_plan', 'reservoir_plan', 'generic_node'];
            
            if(insertTools.includes(tool)) {
                statusText = "แทรกโหนด/โครงสร้าง";
                helpText = "คลิกที่ <b>'เส้นลำน้ำ'</b> เพื่อแทรกจุด/โครงสร้าง หรือคลิกพื้นที่ว่างเพื่อวางอิสระ";
            } else if (tool === 'waterbody') {
                statusText = "เพิ่มแหล่งน้ำ";
                helpText = "คลิกที่พื้นที่ว่าง หรือใกล้ลำน้ำเพื่อวางแหล่งน้ำ";
            } else if (tool.startsWith('draw_')) {
                statusText = "วาดเส้นทางน้ำ";
                helpText = "1. คลิก <b>'โหนดต้นทาง'</b><br>2. คลิก <b>'โหนดปลายทาง'</b> เพื่อเชื่อมเส้น";
            } else if (tool === 'delete') {
                statusText = "ลบข้อมูล";
                helpText = "คลิกที่ <b>'เส้น'</b> หรือ <b>'โหนด'</b> ที่ต้องการลบ";
            } else if (tool === 'edit_info') {
                statusText = "แก้ไขข้อมูล";
                helpText = "คลิกที่ <b>'โครงสร้าง'</b> หรือ <b>'เส้นคลอง'</b> ที่ต้องการเปลี่ยนชื่อหรือใส่รายละเอียด";
            } else if (tool === 'text_box') {
                statusText = "ข้อความอิสระ";
                helpText = "คลิกที่ <b>'พื้นที่ว่าง'</b> บริเวณที่ต้องการวางข้อความกำกับ";
            } else if (tool === 'rotate') {
                statusText = "หมุนสัญลักษณ์";
                helpText = "คลิกที่ <b>'ฝาย'</b> หรือ <b>'กล่องข้อความ'</b> เพื่อหมุน";
            }

            document.getElementById('current-tool').innerHTML = statusText;
            document.getElementById('help-text').innerHTML = helpText;
            cy.nodes().removeClass('selected-source');
        }

        const initialElements = [
            { data: { id: 'n1', label: 'จุดกำเนิดน้ำ', rotation: 0, dir: 'h' }, position: { x: 300, y: 100 } },
            { data: { id: 'n2', label: 'จุดตัดคลอง', rotation: 0, dir: 'h' }, position: { x: 300, y: 300 } },
            { data: { id: 'n3', label: 'ปลายน้ำ', rotation: 0, dir: 'h' }, position: { x: 300, y: 500 } },
            { data: { id: 'n4', label: 'บึงสลุต\n500,000 ลบ.ม.', type: 'waterbody', rotation: 0, dir: 'h' }, position: { x: 500, y: 300 } },
            { data: { id: 'e1', source: 'n1', target: 'n2', label: 'คลองหลัก', type: 'main' } },
            { data: { id: 'e2', source: 'n2', target: 'n3', label: 'คลองหลัก', type: 'main' } }
        ];

        // ===== Phase 5 (ADR-004): เชื่อม Supabase จริง =====
        // schema ข้อมูลจริง (nw.*) ถูกล็อกไว้ไม่ให้ anon/authenticated แตะตรงเลย — เข้าถึงได้ทางเดียวคือผ่าน
        // view/ฟังก์ชัน wrapper ใน public ที่มี prefix nw_ (public.nw_diagram_current_nodes/edges สำหรับอ่าน,
        // public.nw_save_diagram() สำหรับเขียน) เหตุผลที่ต้องมี wrapper: PostgREST ของ project นี้ (ใช้ร่วมกับ
        // ระบบน้ำตำบลแม่นาเรือ) expose แค่ schema public เท่านั้น การเปิด schema nw เพิ่มต้องแก้ config ระดับ
        // project ซึ่งเสี่ยงกระทบ API เดิม จึงเลี่ยงไม่แตะเลย
        const SUPABASE_URL = 'https://khfixycxjwxcpayiwxap.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_1Iju7_QORaqhtYE4HryrGQ_KzYGx_1i';

        // ตำบลบางแห่งมีไฟล์ OSM waterway ที่คัดสรร/ทดสอบไว้ล่วงหน้าแล้ว (ดีกว่าดึงสดจาก Overpass ซ้ำทุกครั้ง) —
        // จับคู่ด้วยชื่อจังหวัด/อำเภอ/ตำบล (ตัดคำนำหน้าออกก่อนเทียบ เหมือนฝั่ง Supabase/engine) ตำบลอื่นที่ไม่อยู่ใน
        // นี้จะให้ engine service ดึง OSM สดจาก Overpass API เอง (ดู 01_engine/00_fetch_osm_waterways.py)
        const CURATED_OSM_OVERRIDES = [
            { province_th: 'พิษณุโลก', amphoe_th: 'บางกระทุ่ม', tambon_th: 'นครป่าหมาก', osm_geojson_filename: 'nakhon_pa_mak_osm_waterways.geojson' }
        ];

        function normalizeThaiAdminName(name) {
            const prefixes = ['ตำบล', 'ต.', 'แขวง', 'อำเภอ', 'อ.', 'เขต'];
            name = (name || '').trim();
            for (const p of prefixes) {
                if (name.startsWith(p)) return name.slice(p.length).trim();
            }
            return name;
        }

        function findCuratedOsmFilename(province_th, amphoe_th, tambon_th) {
            const np = normalizeThaiAdminName(province_th), na = normalizeThaiAdminName(amphoe_th), nt = normalizeThaiAdminName(tambon_th);
            const hit = CURATED_OSM_OVERRIDES.find(o => normalizeThaiAdminName(o.province_th) === np
                && normalizeThaiAdminName(o.amphoe_th) === na && normalizeThaiAdminName(o.tambon_th) === nt);
            return hit ? hit.osm_geojson_filename : null;
        }

        // ตำบลที่โหลดตอนเปิดหน้าเว็บครั้งแรก (ก่อนผู้ใช้เลือกอะไรเอง) — เดิมทีเป็นตำบลนำร่องเดียวที่ระบบมี
        const DEFAULT_TAMBON = { tambon_id: '20451bd6-df9d-4214-b2f0-aca23f9f2d91', province_th: 'พิษณุโลก', amphoe_th: 'บางกระทุ่ม', tambon_th: 'นครป่าหมาก' };

        let TAMBON_ID = DEFAULT_TAMBON.tambon_id; // เปลี่ยนได้ตอนรันจริงผ่านตัวเลือกจังหวัด/อำเภอ/ตำบล
        // สถานะตำบลที่กำลังเลือกอยู่ตอนนี้ (province_th/amphoe_th/tambon_th เสมอ, tambon_id เป็น null ถ้ายังไม่มี
        // ผังในระบบ — สถานะ "ตำบลใหม่ ยังไม่เคยสร้าง")
        let CURRENT_TAMBON = { ...DEFAULT_TAMBON };
        let THAI_ADMIN_TREE = null; // {province: {amphoe: [tambon, ...]}} โหลดจาก thai_admin_divisions.json
        const ENGINE_RUN_POLL_MS = 5000;
        const ENGINE_RUN_TIMEOUT_MS = 10 * 60 * 1000; // 10 นาที กันรอค้างตลอดไปถ้า engine ล้มเหลวเงียบๆ

        const supabaseClient = (typeof supabase !== 'undefined')
            ? supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
            : null;

        // โหลดผัง version ปัจจุบัน (is_current=true) ของตำบลนี้จาก Supabase แปลงกลับเป็นฟอร์แมต element ของ
        // Cytoscape.js — คืนค่า null ถ้าโหลดไม่สำเร็จ/ยังไม่เคย publish เข้า Supabase เลย (ให้ fallback ไปใช้
        // engineElements/initialElements แทน ไม่ทำให้หน้าเว็บพังถ้าออฟไลน์/ยังไม่ตั้งค่า)
        async function loadElementsFromSupabase(tambonId) {
            tambonId = tambonId || TAMBON_ID;
            if (!supabaseClient) return null;
            try {
                const [{ data: nodeRows, error: nErr }, { data: edgeRows, error: eErr }] = await Promise.all([
                    supabaseClient.from('nw_diagram_current_nodes').select('*').eq('tambon_id', tambonId),
                    supabaseClient.from('nw_diagram_current_edges').select('*').eq('tambon_id', tambonId)
                ]);
                if (nErr || eErr) { console.error('โหลดผังจาก Supabase ไม่สำเร็จ', nErr, eErr); return null; }
                if (!nodeRows || nodeRows.length === 0) return null; // ยังไม่เคย publish เข้า Supabase เลย

                const nodeEls = nodeRows.map(r => ({
                    data: { id: r.node_key, label: r.label || '', type: r.node_type || undefined, rotation: r.rotation || 0, dir: r.dir || 'h' },
                    position: { x: r.pos_x, y: r.pos_y }
                }));
                const edgeEls = (edgeRows || []).map(r => ({
                    data: {
                        id: r.edge_key, source: r.source_node_key, target: r.target_node_key,
                        label: r.label || '', type: r.edge_type || undefined,
                        ...(r.engine_straight ? { engineStraight: true } : {}),
                        ...(r.engine_bend ? { engineBend: true, segDist: r.seg_dist, segWeight: r.seg_weight } : {})
                    }
                }));
                return nodeEls.concat(edgeEls);
            } catch (e) {
                console.error('โหลดผังจาก Supabase ผิดพลาด', e);
                return null;
            }
        }

        // ===== UI เลือกตำบล (จังหวัด -> อำเภอ -> ตำบล ครบทุกตำบลทั่วประเทศ) + สร้าง/แก้ไข/สั่งรัน engine =====
        async function loadThaiAdminTree() {
            // โหลดผ่าน <script src="thai_admin_divisions.js"> (ตัวแปร global THAI_ADMIN_DIVISIONS) ไม่ใช้ fetch()
            // เพราะหน้านี้เปิดแบบ file:// โดยตรง ซึ่ง fetch ไฟล์ local ในเบราว์เซอร์ส่วนใหญ่ติด CORS (opaque origin)
            if (THAI_ADMIN_TREE) return THAI_ADMIN_TREE;
            THAI_ADMIN_TREE = (typeof THAI_ADMIN_DIVISIONS !== 'undefined') ? THAI_ADMIN_DIVISIONS : {};
            return THAI_ADMIN_TREE;
        }

        function fillSelect(sel, values, placeholder) {
            sel.innerHTML = '<option value="">' + placeholder + '</option>';
            values.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v; opt.textContent = v;
                sel.appendChild(opt);
            });
        }

        async function populateProvinceSelect() {
            const tree = await loadThaiAdminTree();
            const provinceSel = document.getElementById('province-select');
            const provinces = Object.keys(tree).sort((a, b) => a.localeCompare(b, 'th'));
            fillSelect(provinceSel, provinces, '— จังหวัด —');
        }

        async function onProvinceSelectChange() {
            const tree = await loadThaiAdminTree();
            const provinceSel = document.getElementById('province-select');
            const amphoeSel = document.getElementById('amphoe-select');
            const tambonSel = document.getElementById('tambon-pick-select');
            const province = provinceSel.value;
            if (!province) {
                fillSelect(amphoeSel, [], '— อำเภอ —'); amphoeSel.disabled = true;
                fillSelect(tambonSel, [], '— ตำบล —'); tambonSel.disabled = true;
                return;
            }
            const amphoes = Object.keys(tree[province]).sort((a, b) => a.localeCompare(b, 'th'));
            fillSelect(amphoeSel, amphoes, '— อำเภอ —'); amphoeSel.disabled = false;
            fillSelect(tambonSel, [], '— ตำบล —'); tambonSel.disabled = true;
            document.getElementById('tambon-status-info').textContent = '';
            document.getElementById('new-tambon-create-box').style.display = 'none';
        }

        async function onAmphoeSelectChange() {
            const tree = await loadThaiAdminTree();
            const province = document.getElementById('province-select').value;
            const amphoeSel = document.getElementById('amphoe-select');
            const tambonSel = document.getElementById('tambon-pick-select');
            const amphoe = amphoeSel.value;
            if (!amphoe) { fillSelect(tambonSel, [], '— ตำบล —'); tambonSel.disabled = true; return; }
            const tambons = (tree[province][amphoe] || []).slice().sort((a, b) => a.localeCompare(b, 'th'));
            fillSelect(tambonSel, tambons, '— ตำบล —'); tambonSel.disabled = false;
            document.getElementById('tambon-status-info').textContent = '';
            document.getElementById('new-tambon-create-box').style.display = 'none';
        }

        async function onTambonPickSelectChange() {
            const province_th = document.getElementById('province-select').value;
            const amphoe_th = document.getElementById('amphoe-select').value;
            const tambon_th = document.getElementById('tambon-pick-select').value;
            const statusEl = document.getElementById('tambon-status-info');
            const createBox = document.getElementById('new-tambon-create-box');
            const runBtn = document.getElementById('btn-run-engine');
            if (!tambon_th) { createBox.style.display = 'none'; return; }

            CURRENT_TAMBON = { tambon_id: null, province_th, amphoe_th, tambon_th };
            statusEl.style.color = '#666';
            statusEl.textContent = 'กำลังตรวจสอบว่ามีผังของตำบลนี้อยู่แล้วหรือยัง...';
            createBox.style.display = 'none';
            runBtn.style.display = '';

            if (!supabaseClient) { statusEl.style.color = '#dc3545'; statusEl.textContent = 'ยังไม่ได้เชื่อมต่อ Supabase'; return; }

            const { data: foundId, error } = await supabaseClient.rpc('nw_find_tambon_id', {
                p_province_th: province_th, p_amphoe_th: amphoe_th, p_tambon_th: tambon_th
            });

            if (error) {
                statusEl.style.color = '#dc3545';
                statusEl.textContent = 'ตรวจสอบไม่สำเร็จ: ' + error.message;
                return;
            }

            if (foundId) {
                // ตำบลนี้มีอยู่แล้วในระบบ — โหลดผังมาแสดง (มีหรือยังไม่มีผัง diagram ก็ได้ แค่มีแถวตำบลแล้ว)
                CURRENT_TAMBON.tambon_id = foundId;
                TAMBON_ID = foundId;
                statusEl.style.color = '#666';
                statusEl.textContent = 'กำลังโหลดผังของตำบลนี้...';
                const els = await loadElementsFromSupabase(foundId);
                if (els && cy) {
                    cy.elements().remove();
                    cy.add(els);
                    cy.layout({ name: 'preset' }).run();
                    statusEl.textContent = 'มีผังของตำบลนี้อยู่แล้ว (' + els.length + ' element) — แก้ไขต่อได้เลย หรือกด "รัน Engine ใหม่" เพื่อสร้างทับด้วยข้อมูลล่าสุด';
                } else if (cy) {
                    cy.elements().remove();
                    statusEl.textContent = 'ตำบลนี้มีอยู่ในระบบแล้วแต่ยังไม่เคยรัน engine สร้างผัง — กด "รัน Engine ใหม่" ด้านล่างเพื่อสร้างผังแรกได้เลย';
                }
            } else {
                // ยังไม่มีตำบลนี้ในระบบเลย — ให้ตั้งรหัสผ่านแล้วสร้างใหม่
                statusEl.style.color = '#856404';
                statusEl.textContent = 'ยังไม่มีผังของตำบลนี้ในระบบ — ตั้งรหัสผ่าน manager สำหรับตำบลนี้แล้วกด "สร้างผังน้ำตำบลนี้" ได้เลย';
                createBox.style.display = '';
                runBtn.style.display = 'none';
                if (cy) cy.elements().remove();
            }
        }

        async function onCreateNewTambonClick() {
            const statusEl = document.getElementById('tambon-status-info');
            const createBtn = document.getElementById('btn-create-tambon');
            const password = document.getElementById('new-tambon-password').value;
            if (!password || password.length < 4) {
                statusEl.style.color = '#dc3545';
                statusEl.textContent = 'ตั้งรหัสผ่านอย่างน้อย 4 ตัวอักษร';
                return;
            }
            if (!supabaseClient) { statusEl.style.color = '#dc3545'; statusEl.textContent = 'ยังไม่ได้เชื่อมต่อ Supabase'; return; }

            createBtn.disabled = true;
            statusEl.style.color = '#856404';
            statusEl.textContent = 'กำลังสร้างตำบลใหม่ในระบบ...';

            const { data, error } = await supabaseClient.rpc('nw_register_new_tambon', {
                p_province_th: CURRENT_TAMBON.province_th,
                p_amphoe_th: CURRENT_TAMBON.amphoe_th,
                p_tambon_th: CURRENT_TAMBON.tambon_th,
                p_manager_password: password
            });

            if (error || !data || data.success !== true) {
                statusEl.style.color = '#dc3545';
                statusEl.textContent = 'สร้างไม่สำเร็จ: ' + ((data && data.error) || (error && error.message) || 'ไม่ทราบสาเหตุ');
                createBtn.disabled = false;
                return;
            }

            CURRENT_TAMBON.tambon_id = data.tambon_id;
            TAMBON_ID = data.tambon_id;
            document.getElementById('new-tambon-create-box').style.display = 'none';
            document.getElementById('btn-run-engine').style.display = '';
            statusEl.style.color = '#28a745';
            statusEl.textContent = 'สร้างตำบลในระบบแล้ว — กำลังสั่งรัน engine ครั้งแรกให้อัตโนมัติ...';

            // สั่งรัน engine ทันทีด้วยรหัสผ่านเดียวกับที่เพิ่งตั้ง (ไม่ต้องให้พิมพ์ซ้ำ)
            await runEngineForCurrentTambon(password);
            createBtn.disabled = false;
        }

        function pollEngineRunResult(tambonId, beforeVersionId, statusEl, btn) {
            const startedAt = Date.now();
            const timer = setInterval(async () => {
                if (Date.now() - startedAt > ENGINE_RUN_TIMEOUT_MS) {
                    clearInterval(timer);
                    statusEl.style.color = '#dc3545';
                    statusEl.textContent = 'รอนานเกินไป (เกิน 10 นาที) — engine อาจล้มเหลว ลองเช็ค Logs บน Render dashboard';
                    btn.disabled = false;
                    return;
                }
                try {
                    const { data: meta } = await supabaseClient
                        .from('nw_diagram_latest_version_meta')
                        .select('version_id, source, created_at')
                        .eq('tambon_id', tambonId)
                        .maybeSingle();
                    if (meta && meta.version_id !== beforeVersionId && meta.source === 'engine') {
                        clearInterval(timer);
                        statusEl.style.color = '#28a745';
                        statusEl.textContent = 'เสร็จแล้ว! กำลังโหลดผังใหม่...';
                        btn.disabled = false;
                        const els = await loadElementsFromSupabase(tambonId);
                        if (els && cy) {
                            cy.elements().remove();
                            cy.add(els);
                            cy.layout({ name: 'preset' }).run();
                            statusEl.textContent = 'โหลดผังใหม่เรียบร้อยแล้ว (' + els.length + ' element)';
                        }
                    }
                } catch (e) {
                    console.error('poll สถานะ engine run ผิดพลาด', e); // เงียบไว้ รอ poll รอบถัดไป ไม่ spam ผู้ใช้
                }
            }, ENGINE_RUN_POLL_MS);
        }

        // ยิงคำสั่งรัน engine จริง (ใช้ร่วมกันทั้งปุ่ม "รัน Engine ใหม่" ปกติ และตอนสร้างตำบลใหม่เสร็จแล้วรันต่อทันที)
        async function runEngineForCurrentTambon(password) {
            const statusEl = document.getElementById('engine-run-status');
            const btn = document.getElementById('btn-run-engine');
            const tambon = CURRENT_TAMBON;

            btn.disabled = true;
            statusEl.style.color = '#856404';
            statusEl.textContent = 'กำลังส่งคำสั่งรัน engine...';

            try {
                const { data: beforeMeta } = await supabaseClient
                    .from('nw_diagram_latest_version_meta')
                    .select('version_id')
                    .eq('tambon_id', tambon.tambon_id)
                    .maybeSingle();
                const beforeVersionId = beforeMeta ? beforeMeta.version_id : null;

                const osmOverride = findCuratedOsmFilename(tambon.province_th, tambon.amphoe_th, tambon.tambon_th);
                const { data, error } = await supabaseClient.rpc('nw_trigger_engine_run', {
                    p_tambon_id: tambon.tambon_id,
                    p_manager_password: password,
                    p_province_th: tambon.province_th,
                    p_amphoe_th: tambon.amphoe_th,
                    p_tambon_th: tambon.tambon_th,
                    p_osm_geojson_filename: osmOverride
                });

                if (error || !data || data.success !== true) {
                    statusEl.style.color = '#dc3545';
                    statusEl.textContent = 'ผิดพลาด: ' + ((data && data.error) || (error && error.message) || 'ไม่ทราบสาเหตุ');
                    btn.disabled = false;
                    return;
                }

                statusEl.style.color = '#856404';
                statusEl.textContent = 'ส่งคำสั่งแล้ว กำลังรอ engine ประมวลผล (ตำบลใหม่ที่ต้องดึง OSM สดจาก Overpass '
                    + 'อาจใช้เวลานานกว่าปกติ รวมถึง 30 วินาทีถึงหลายนาทีถ้า Render sleep อยู่)...';
                pollEngineRunResult(tambon.tambon_id, beforeVersionId, statusEl, btn);
            } catch (e) {
                statusEl.style.color = '#dc3545';
                statusEl.textContent = 'ผิดพลาด: ' + e.message;
                btn.disabled = false;
            }
        }

        async function onRunEngineClick() {
            const statusEl = document.getElementById('engine-run-status');
            if (!CURRENT_TAMBON || !CURRENT_TAMBON.tambon_id) {
                statusEl.style.color = '#dc3545';
                statusEl.textContent = 'เลือกตำบลก่อน (หรือถ้าเป็นตำบลใหม่ ต้องกด "สร้างผังน้ำตำบลนี้" ก่อน)';
                return;
            }
            const password = prompt('กรอกรหัสผ่าน manager เพื่อยืนยันการรัน engine ใหม่สำหรับ "' + CURRENT_TAMBON.tambon_th + '"\n\n' +
                '(จะสร้างผังเวอร์ชันใหม่ทับผังปัจจุบัน — ผังเดิมยังถูกเก็บไว้เป็นประวัติ ไม่หายไปไหน)');
            if (!password) return;
            if (!supabaseClient) { statusEl.style.color = '#dc3545'; statusEl.textContent = 'ยังไม่ได้เชื่อมต่อ Supabase'; return; }
            await runEngineForCurrentTambon(password);
        }

        async function setupTambonUI() {
            await populateProvinceSelect();
            document.getElementById('province-select').addEventListener('change', onProvinceSelectChange);
            document.getElementById('amphoe-select').addEventListener('change', onAmphoeSelectChange);
            document.getElementById('tambon-pick-select').addEventListener('change', onTambonPickSelectChange);

            // เลือกตำบลเริ่มต้น (นครป่าหมาก) ให้ตรงกับผังที่แสดงอยู่แล้วตอนเปิดหน้าเว็บ
            const tree = await loadThaiAdminTree();
            const provinceSel = document.getElementById('province-select');
            if (tree[DEFAULT_TAMBON.province_th]) {
                provinceSel.value = DEFAULT_TAMBON.province_th;
                await onProvinceSelectChange();
                const amphoeSel = document.getElementById('amphoe-select');
                amphoeSel.value = DEFAULT_TAMBON.amphoe_th;
                await onAmphoeSelectChange();
                const tambonSel = document.getElementById('tambon-pick-select');
                tambonSel.value = DEFAULT_TAMBON.tambon_th;
                // ไม่ต้องเรียก onTambonPickSelectChange() — ผังเริ่มต้นโหลดผ่าน initApp()/loadElementsFromSupabase()
                // อยู่แล้วตอนเปิดหน้าเว็บ แค่ให้ dropdown แสดงค่าตรงกันเฉย ๆ
                CURRENT_TAMBON = { ...DEFAULT_TAMBON, tambon_id: DEFAULT_TAMBON.tambon_id };
            }
        }

        let cy; // สร้างจริงใน initApp() ด้านล่าง (ต้องรอผลโหลดจาก Supabase ก่อน ถึงจะรู้ว่าจะใช้ elements ชุดไหน)

        async function initApp() {
        const supabaseElements = await loadElementsFromSupabase();
        cy = cytoscape({
            container: document.getElementById('cy'),
            elements: supabaseElements || (typeof engineElements !== 'undefined' ? engineElements : initialElements),
            // สำคัญ: ต้องระบุ layout เป็น 'preset' เสมอ มิฉะนั้น Cytoscape.js จะใช้ layout ค่าเริ่มต้น
            // ('grid') ซึ่ง "เพิกเฉย" ตำแหน่ง position ที่กำหนดไว้ในแต่ละ node แล้ววาง node ใหม่เป็น
            // ตารางเรียงแถวคอลัมน์ของตัวเองแทน — นี่คือสาเหตุจริงที่ทำให้ผังจาก engine (Phase 3) ดู
            // เพี้ยนไปหมด (จุดเรียงเป็นกริดสวยงามแต่เส้นเชื่อมวิ่งทแยงมั่วไปทั่วจอ) ทั้งที่ข้อมูลตำแหน่ง
            // ที่ engine คำนวณมาถูกต้องอยู่แล้ว
            layout: { name: 'preset' },
            style: [
                { selector: 'node', style: { 'background-color': '#adb5bd', 'width': 8, 'height': 8, 'label': 'data(label)', 'font-family': 'Sarabun', 'font-size': '12px', 'text-valign': 'top', 'text-margin-y': -5, 'text-wrap': 'wrap', 'text-max-width': '150px', 'text-rotation': function(ele){ return (ele.data('rotation') || 0) + 'deg'; } } },
                { selector: 'node[type="generic_node"]', style: { 'background-color': '#6c757d', 'width': 10, 'height': 10 } },
                
                { selector: 'node[type="text_box"]', style: { 'shape': 'rectangle', 'background-opacity': 0, 'width': 1, 'height': 1, 'color': '#d9534f', 'font-size': '14px', 'font-weight': 'bold', 'text-valign': 'center', 'text-halign': 'center', 'text-outline-width': 2, 'text-outline-color': '#ffffff' } },
                
                { selector: 'edge', style: { 'width': 3, 'line-color': '#4da6ff', 'target-arrow-color': '#4da6ff', 'target-arrow-shape': 'triangle', 'curve-style': 'taxi', 'taxi-direction': 'downward', 'label': 'data(label)', 'font-size': '12px', 'text-rotation': '0deg', 'text-margin-y': -10, 'text-background-color': '#ffffff', 'text-background-opacity': 0.7, 'text-background-padding': '2px' } },
                { selector: 'edge[type="main"]', style: { 'width': 6, 'line-color': '#0056b3', 'target-arrow-color': '#0056b3' } },

                /* เส้นที่มาจาก engine (Phase 3) — บังคับให้วาดตรงจุด/มุมที่ engine คำนวณไว้จริง ไม่ปล่อยให้
                   Cytoscape คำนวณเส้นทางเองแบบเส้นที่ชุมชนวาดเพิ่ม (ซึ่งยังใช้ taxi/downward ด้านบนตามเดิม) —
                   แก้ปัญหาที่ผังจาก engine ดูเป็นตารางกริดซับซ้อนเกินจริงเทียบกับภาพ sanity check ของ Phase 3 */
                { selector: 'edge[?engineStraight]', style: { 'curve-style': 'straight' } },
                { selector: 'edge[?engineBend]', style: { 'curve-style': 'segments', 'segment-distances': 'data(segDist)', 'segment-weights': 'data(segWeight)' } },

                { selector: 'node[type="reservoir"]', style: { 'shape': 'triangle', 'background-color': 'black', 'width': 30, 'height': 30, 'text-margin-y': -15 } },

                { selector: 'node[type="weir_plan"][dir="v"]', style: { 'width': 12, 'height': 35, 'text-margin-y': -5, 'text-margin-x': 0, 'text-valign': 'top', 'text-halign': 'center' } },
                
                { selector: 'node[type="telemetry"]', style: { 'shape': 'ellipse', 'background-color': 'white', 'border-width': 4, 'border-color': 'black', 'width': 20, 'height': 20 } },
                { selector: 'node[type="pump"]', style: { 'shape': 'ellipse', 'background-color': 'white', 'border-width': 2, 'border-color': 'black', 'width': 25, 'height': 25, 'label': 'P', 'text-valign': 'center', 'text-halign': 'center', 'font-weight': 'bold', 'color': 'black', 'font-size': '14px' } },
                { selector: 'node[type="waterbody"]', style: { 'shape': 'round-rectangle', 'background-color': '#99ccff', 'border-width': 1, 'border-color': '#0056b3', 'width': 70, 'height': 35, 'text-valign': 'center', 'text-margin-y': 0, 'color': '#003366', 'font-weight': 'bold' } },
                { selector: 'node[type="waterbody"][dir="v"]', style: { 'width': 35, 'height': 70 } }, 
                
                { selector: '.selected-source', style: { 'border-width': 3, 'border-color': '#ffc107', 'background-color': '#ffc107' } }
            ]
        });

        // บันทึกสถานะตั้งต้นเมื่อโหลดหน้าเว็บ
        cy.ready(function() {
            saveState();
        });

        // บันทึก History หากผู้ใช้ลากจุดเปลี่ยนตำแหน่ง
        cy.on('dragfree', 'node', function() {
            saveState();
        });

        cy.on('tap', function(evt) {
            let target = evt.target;
            const insertTools = ['gate', 'weir', 'reservoir', 'telemetry', 'pump', 'gate_plan', 'weir_plan', 'reservoir_plan', 'generic_node'];
            const labelMap = { 
                gate: 'ปตร.', weir: 'ฝาย', reservoir: 'อ่างฯ', telemetry: 'โทรมาตร', pump: '', 
                gate_plan: 'ปตร.(แผน)', weir_plan: 'ฝาย(แผน)', generic_node: '', waterbody: 'ชื่อแหล่งน้ำ\n(ความจุ)'
            };

            // 1. โหมดหมุนสัญลักษณ์ (Rotate)
            if (currentTool === 'rotate') {
                if (target.isNode && target.isNode()) {
                    let type = target.data('type');
                    
                    if (['weir', 'weir_plan', 'waterbody'].includes(type)) {
                        let currentDir = target.data('dir') || 'h';
                        target.data('dir', currentDir === 'h' ? 'v' : 'h');
                        target.data('rotation', 0);
                    } else {
                        let currentRot = target.data('rotation') || 0;
                        target.data('rotation', (currentRot + 90) % 360);
                    }
                    saveState(); // บันทึก History หลังหมุน
                }
                return;
            }

            // 2. โหมดแก้ไขชื่อ/รายละเอียด (Edit Info)
            if (currentTool === 'edit_info') {
                if (target !== cy) {
                    let currentLabel = target.data('label') || '';
                    let textType = target.isEdge() ? "ชื่อลำน้ำ" : "ชื่อ/รายละเอียด (ใช้ \\n เพื่อขึ้นบรรทัดใหม่)";
                    let newLabel = prompt(`กรุณากรอก ${textType}:`, currentLabel.replace(/\n/g, "\\n"));
                    
                    if (newLabel !== null) {
                        target.data('label', newLabel.replace(/\\n/g, "\n")); 
                        saveState(); // บันทึก History หลังแก้ข้อความ
                    }
                }
                return;
            }

            // 3. โหมดข้อความอิสระ (Text Box)
            if (currentTool === 'text_box') {
                if (target === cy) { 
                    let text = prompt("กรอกข้อความอิสระ:");
                    if (text) {
                        cy.add({ group: 'nodes', data: { id: 't_new_' + nodeCount++, label: text, type: 'text_box', rotation: 0, dir: 'h' }, position: evt.position });
                        saveState(); // บันทึก History หลังเพิ่มข้อความ
                    }
                    selectTool(null, null);
                }
                return;
            }

            // 4. โหมดลบ
            if (currentTool === 'delete') {
                if (target !== cy) {
                    cy.remove(target);
                    saveState(); // บันทึก History หลังลบ
                }
                return;
            }

            // 5. โหมดวาดเส้น
            if (currentTool === 'draw_main' || currentTool === 'draw_branch') {
                if (target === cy) {
                    sourceNodeForEdge = null;
                    cy.nodes().removeClass('selected-source');
                } else if (target.isNode()) {
                    if (!sourceNodeForEdge) {
                        sourceNodeForEdge = target;
                        target.addClass('selected-source');
                    } else {
                        if(sourceNodeForEdge.id() !== target.id()) {
                            let edgeType = currentTool === 'draw_main' ? 'main' : 'branch';
                            cy.add({
                                group: 'edges',
                                data: { id: 'e_new_' + nodeCount++, source: sourceNodeForEdge.id(), target: target.id(), type: edgeType, label: '' }
                            });
                            saveState(); // บันทึก History หลังสร้างเส้น
                        }
                        sourceNodeForEdge.removeClass('selected-source');
                        sourceNodeForEdge = null; 
                    }
                }
                return;
            }

            // 6. แทรกโหนด/โครงสร้างลงบนเส้นเดิม (Split Line)
            if (target.isEdge && target.isEdge() && insertTools.includes(currentTool)) {
                let sourceId = target.data('source');
                let targetId = target.data('target');
                let edgeType = target.data('type');
                
                cy.add({ group: 'nodes', data: { id: 'n_new_' + nodeCount, label: labelMap[currentTool], type: currentTool, rotation: 0, dir: 'h' }, position: evt.position });
                
                cy.remove(target);
                cy.add([
                    { group: 'edges', data: { id: 'e_splitA_' + nodeCount, source: sourceId, target: 'n_new_' + nodeCount, type: edgeType, label: target.data('label') } },
                    { group: 'edges', data: { id: 'e_splitB_' + nodeCount, source: 'n_new_' + nodeCount, target: targetId, type: edgeType } }
                ]);
                nodeCount++;
                saveState(); // บันทึก History หลังตัดเส้นแทรกโหนด
                
                if(currentTool !== 'generic_node') selectTool(null, null); 
                return;
            }

            // 7. วางโหนด/โครงสร้างอิสระบนพื้นที่ว่าง
            if (target === cy && (insertTools.includes(currentTool) || currentTool === 'waterbody')) {
                cy.add({ group: 'nodes', data: { id: 'n_new_' + nodeCount++, label: labelMap[currentTool], type: currentTool, rotation: 0, dir: 'h' }, position: evt.position });
                saveState(); // บันทึก History หลังวางโหนดอิสระ
                
                if(!['waterbody', 'generic_node'].includes(currentTool)) selectTool(null, null); 
                return;
            }
        });


        setupTambonUI();
        } // จบ initApp()
        initApp();

        // บันทึกผังปัจจุบันเข้า Supabase จริง (Phase 5, ADR-004) — แทนที่การดาวน์โหลดไฟล์ .json แบบเดิม
        // เรียกผ่าน public.nw_save_diagram() ซึ่งตรวจรหัสผ่าน villager_form ของตำบลนี้ก่อนเขียนทุกครั้ง
        // (รหัสเดียวกับแบบฟอร์มกรอกระดับน้ำเดิม) บันทึกเป็น version ใหม่เสมอ ไม่ทับของเดิม — ถ้ายังไม่มี
        // อินเทอร์เน็ต/เชื่อม Supabase ไม่ได้ จะ fallback ไปดาวน์โหลดไฟล์ .json ลงเครื่องแทนเหมือนเดิม
        async function exportData() {
            const exportedJSON = cy.json();
            const allEls = exportedJSON.elements.nodes ? exportedJSON.elements.nodes.concat(exportedJSON.elements.edges || [])
                : (Array.isArray(exportedJSON.elements) ? exportedJSON.elements : []);

            if (!supabaseClient) {
                downloadAsJsonFile(allEls);
                return;
            }

            const password = prompt('กรอกรหัสผ่านแบบฟอร์มชุมชน (villager_form) ของตำบลนี้ เพื่อบันทึกผังน้ำ:');
            if (password === null) return; // ผู้ใช้กดยกเลิก

            const nodes = [];
            const edges = [];
            allEls.forEach(el => {
                const d = el.data;
                if (d.source !== undefined) {
                    edges.push({
                        edge_key: d.id, source_node_key: d.source, target_node_key: d.target,
                        label: d.label || '', edge_type: d.type || null,
                        engine_straight: !!d.engineStraight, engine_bend: !!d.engineBend,
                        seg_dist: d.segDist ?? null, seg_weight: d.segWeight ?? null
                    });
                } else {
                    nodes.push({
                        node_key: d.id, label: d.label || '', node_type: d.type || null,
                        rotation: d.rotation || 0, dir: d.dir || 'h',
                        pos_x: el.position.x, pos_y: el.position.y
                    });
                }
            });

            const { data, error } = await supabaseClient.rpc('nw_save_diagram', {
                p_tambon_id: TAMBON_ID, p_password: password, p_source: 'community',
                p_label: 'บันทึกจากชุมชนผ่านหน้าเว็บ', p_entered_by: null,
                p_nodes: nodes, p_edges: edges
            });

            if (error) {
                alert('บันทึกไม่สำเร็จ (เชื่อมต่อ Supabase ไม่ได้): ' + error.message + '\nจะดาวน์โหลดไฟล์ .json สำรองไว้แทน');
                downloadAsJsonFile(allEls);
                return;
            }
            if (!data || !data.success) {
                alert('บันทึกไม่สำเร็จ: ' + (data ? data.error : 'ไม่ทราบสาเหตุ') + (data && data.error === 'invalid_password' ? ' (รหัสผ่านไม่ถูกต้อง)' : ''));
                return;
            }
            alert('บันทึกผังน้ำเข้า Supabase เรียบร้อย! (version ใหม่ ไม่ทับของเดิม)');
        }

        // สำรอง: ดาวน์โหลดเป็นไฟล์ .json ลงเครื่อง (ใช้เมื่อเชื่อม Supabase ไม่ได้เท่านั้น)
        function downloadAsJsonFile(elements) {
            let dataStr = JSON.stringify(elements, null, 2);
            let blob = new Blob([dataStr], { type: "application/json" });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            let timestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
            a.href = url;
            a.download = `phang_nam_nakhon_pa_mak_${timestamp}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
